name: Build Self-Contained DEB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Build Tools & Qt6 via APT
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            patchelf \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libdbus-1-dev

      - name: Build Application
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package Self-Contained DEB
        run: |
          APP_NAME="graber"
          PKG_DIR="package-root"

          # 1. Prepare Directory Structure
          mkdir -p ${PKG_DIR}/DEBIAN
          mkdir -p ${PKG_DIR}/usr/bin
          mkdir -p ${PKG_DIR}/usr/lib/${APP_NAME}
          mkdir -p ${PKG_DIR}/usr/lib/${APP_NAME}/platforms

          # 2. Copy Executable
          cp build/${APP_NAME} ${PKG_DIR}/usr/bin/

          BIN_PATH="${PKG_DIR}/usr/bin/${APP_NAME}"
          LIB_DIR="${PKG_DIR}/usr/lib/${APP_NAME}"

          # 3. Copy Qt Platform Plugins (XCB for Linux GUI rendering)
          QT_PLUGIN_PATH=$(qtpaths --plugin-dir 2>/dev/null || echo "/usr/lib/x86_64-linux-gnu/qt6/plugins")
          if [ -d "${QT_PLUGIN_PATH}/platforms" ]; then
            cp -r "${QT_PLUGIN_PATH}/platforms"/* "${LIB_DIR}/platforms/"
          fi

          # 4. Copy Shared Library Dependencies using ldd
          ldd "${BIN_PATH}" | grep "=>" | awk '{print $3}' | grep -v '^$' | while read -r lib; do
            if [ -f "$lib" ]; then
              case "$(basename "$lib")" in
                # Skip core glibc system libraries to avoid crashes on other distros
                libc.so*|libpthread.so*|libdl.so*|libm.so*|librt.so*|ld-linux*)
                  ;;
                *)
                  cp -L "$lib" "${LIB_DIR}/"
                  ;;
              esac
            fi
          done

          # Also grab plugin dependencies (like libQt6XcbQpa.so, etc.)
          for plugin in "${LIB_DIR}"/platforms/*.so; do
            if [ -f "$plugin" ]; then
              ldd "$plugin" | grep "=>" | awk '{print $3}' | grep -v '^$' | while read -r lib; do
                if [ -f "$lib" ]; then
                  case "$(basename "$lib")" in
                    libc.so*|libpthread.so*|libdl.so*|libm.so*|librt.so*|ld-linux*)
                      ;;
                    *)
                      cp -L -n "$lib" "${LIB_DIR}/" 2>/dev/null || true
                      ;;
                  esac
                fi
              done
            fi
          done

          # 5. Patch RPATH using patchelf
          patchelf --set-rpath "\$ORIGIN/../lib/${APP_NAME}" "${BIN_PATH}"

          for lib in "${LIB_DIR}"/*.so* "${LIB_DIR}"/platforms/*.so*; do
            if [ -f "$lib" ]; then
              patchelf --set-rpath "\$ORIGIN" "$lib" 2>/dev/null || true
            fi
          done

          # 6. Strip Debug Symbols to reduce overall package size
          strip --strip-unneeded "${BIN_PATH}" 2>/dev/null || true
          for lib in "${LIB_DIR}"/*.so* "${LIB_DIR}"/platforms/*.so*; do
            if [ -f "$lib" ]; then
              strip --strip-unneeded "$lib" 2>/dev/null || true
            fi
          done

          # 7. Write DEBIAN/control file (Empty dependencies field)
          cat <<EOF > ${PKG_DIR}/DEBIAN/control
          Package: ${APP_NAME}
          Version: 1.0.0
          Architecture: amd64
          Maintainer: Developer <dev@example.com>
          Section: utils
          Priority: optional
          Description: Fully self-contained ${APP_NAME} application.
          EOF

          # Set proper execution and file permissions
          chmod -R 755 ${PKG_DIR}/DEBIAN
          chmod 755 ${BIN_PATH}
          chmod -R 644 ${LIB_DIR}/*.so* 2>/dev/null || true

          # 8. Build Compressed DEB Package
          dpkg-deb -Zxz -z9 --build ${PKG_DIR} ${APP_NAME}_1.0.0_amd64.deb

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: graber-standalone-deb
          path: "*.deb"
