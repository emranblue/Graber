name: CI/CD Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Package (.deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt 6.8
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libx11-xcb-dev \
            libglu1-mesa-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            wget file

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        run: cmake --build build --config Release

      - name: Bundle Qt & Create .deb Package
        run: |
          # 1. Locate QMake path dynamically from install-qt step output
          QT_BIN_DIR="${{ steps.install-qt.outputs.qtPath }}/bin"
          export PATH="$QT_BIN_DIR:$PATH"
          export QMAKE="$QT_BIN_DIR/qmake"

          echo "Using QMAKE at: $QMAKE"

          # 2. Download bundling tools (linuxdeploy & Qt plugin)
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          # 3. Prepare Linux directory structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps/

          # Copy compiled binary
          cp build/graber AppDir/usr/bin/

          # Create desktop shortcut file
          cat << 'EOF' > AppDir/usr/share/applications/graber.desktop
          [Desktop Entry]
          Type=Application
          Name=Clipboard Graber
          Comment=Clipboard note capturing and markdown utility
          Exec=graber
          Icon=graber
          Terminal=false
          Categories=Utility;Office;
          EOF

          # Touch dummy icon reference so packaging succeeds
          touch AppDir/usr/share/icons/hicolor/scalable/apps/graber.svg

          # 4. Bundle Qt 6.8 dependencies and platform plugins into AppDir
          export EXTRA_QT_PLUGINS="platforms,xcbglintegrations,imageformats,iconengines"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt

          # 5. Create DEB package structure
          mkdir -p debian/usr
          cp -r AppDir/usr/* debian/usr/

          mkdir -p debian/DEBIAN
          cat << 'EOF' > debian/DEBIAN/control
          Package: graber
          Version: 1.0.0
          Architecture: amd64
          Maintainer: Emran <emran.blue.120@gmail.com>
          Depends: libc6, libgl1, libxkbcommon0, libx11-xcb1, libxcb-cursor0
          Description: Clipboard Graber GUI application to capture clipboard content and manage markdown notes.
          EOF

          # Build final .deb file
          dpkg-deb --build debian graber.deb

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: graber-linux-deb
          path: graber.deb
          compression-level: 0

  build-windows:
    name: Build Windows Package
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: 'true'

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Application
        run: cmake --build build --config Release

      - name: Prepare Raw EXE and Bundled ZIP
        shell: pwsh
        run: |
          mkdir dist
          copy build/Release/graber.exe ./graber.exe
          copy build/Release/graber.exe dist/
          windeployqt --dir dist dist/graber.exe
          Compress-Archive -Path dist\* -DestinationPath graber-windows.zip

      - name: Upload Raw EXE
        uses: actions/upload-artifact@v4
        with:
          name: graber-windows-exe
          path: graber.exe
          compression-level: 0

      - name: Upload Bundled ZIP
        uses: actions/upload-artifact@v4
        with:
          name: graber-windows-zip
          path: graber-windows.zip
          compression-level: 0

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            graber-linux-deb/graber.deb
            graber-windows-exe/graber.exe
            graber-windows-zip/graber-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
