name: Build Cross-Platform (Linux & Windows) & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. LINUX SELF-CONTAINED .DEB BUILD
  # ==========================================
  build-linux-deb:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Build Tools & Qt6 via APT
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            patchelf \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libx11-dev \
            libxcb-cursor0

      - name: Build Application (Linux)
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package Self-Contained DEB
        run: |
          APP_NAME="graber"
          PKG_DIR="package-root"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi

          # Directory Structure
          mkdir -p ${PKG_DIR}/DEBIAN
          mkdir -p ${PKG_DIR}/usr/bin
          mkdir -p ${PKG_DIR}/usr/lib/${APP_NAME}
          mkdir -p ${PKG_DIR}/usr/lib/${APP_NAME}/platforms

          BIN_PATH="${PKG_DIR}/usr/lib/${APP_NAME}/${APP_NAME}-bin"
          LIB_DIR="${PKG_DIR}/usr/lib/${APP_NAME}"

          # Copy Real Executable to /usr/lib/graber/
          cp build/${APP_NAME} "${BIN_PATH}"

          # Copy Qt Platform Plugins
          QT_PLUGIN_PATH=$(qtpaths6 --plugin-dir 2>/dev/null || qtpaths --plugin-dir 2>/dev/null || echo "/usr/lib/x86_64-linux-gnu/qt6/plugins")
          if [ -d "${QT_PLUGIN_PATH}/platforms" ]; then
            cp -r "${QT_PLUGIN_PATH}/platforms"/* "${LIB_DIR}/platforms/"
          fi

          # Copy Shared Library Dependencies for Binary
          ldd "${BIN_PATH}" | grep "=>" | awk '{print $3}' | grep -v '^$' | while read -r lib; do
            if [ -f "$lib" ]; then
              case "$(basename "$lib")" in
                libc.so*|libpthread.so*|libdl.so*|libm.so*|librt.so*|ld-linux*)
                  ;;
                *)
                  cp -L "$lib" "${LIB_DIR}/"
                  ;;
              esac
            fi
          done

          # Copy Dependencies for Platform Plugins
          for plugin in "${LIB_DIR}"/platforms/*.so; do
            if [ -f "$plugin" ]; then
              ldd "$plugin" | grep "=>" | awk '{print $3}' | grep -v '^$' | while read -r lib; do
                if [ -f "$lib" ]; then
                  case "$(basename "$lib")" in
                    libc.so*|libpthread.so*|libdl.so*|libm.so*|librt.so*|ld-linux*)
                      ;;
                    *)
                      cp -L -n "$lib" "${LIB_DIR}/" 2>/dev/null || true
                      ;;
                  esac
                fi
              done
            fi
          done

          # Patch RPATH
          patchelf --set-rpath "\$ORIGIN" "${BIN_PATH}"
          for lib in "${LIB_DIR}"/*.so* "${LIB_DIR}"/platforms/*.so*; do
            if [ -f "$lib" ]; then
              patchelf --set-rpath "\$ORIGIN" "$lib" 2>/dev/null || true
            fi
          done

          # Entry Point Wrapper Script
          cat << 'EOF' > ${PKG_DIR}/usr/bin/${APP_NAME}
#!/bin/bash
DIR="/usr/lib/graber"
export QT_PLUGIN_PATH="${DIR}/platforms:${DIR}"
export LD_LIBRARY_PATH="${DIR}:${LD_LIBRARY_PATH}"
exec "${DIR}/graber-bin" "$@"
EOF

          # Strip Debug Symbols
          strip --strip-unneeded "${BIN_PATH}" 2>/dev/null || true
          for lib in "${LIB_DIR}"/*.so* "${LIB_DIR}"/platforms/*.so*; do
            if [ -f "$lib" ]; then
              strip --strip-unneeded "$lib" 2>/dev/null || true
            fi
          done

          # Write DEBIAN/control
          echo "Package: ${APP_NAME}" > ${PKG_DIR}/DEBIAN/control
          echo "Version: ${VERSION}" >> ${PKG_DIR}/DEBIAN/control
          echo "Architecture: amd64" >> ${PKG_DIR}/DEBIAN/control
          echo "Maintainer: Developer <emran.blue.120@gmail.com>" >> ${PKG_DIR}/DEBIAN/control
          echo "Section: utils" >> ${PKG_DIR}/DEBIAN/control
          echo "Priority: optional" >> ${PKG_DIR}/DEBIAN/control
          echo "Description: Fully self-contained ${APP_NAME} application." >> ${PKG_DIR}/DEBIAN/control

          chmod -R 755 ${PKG_DIR}/DEBIAN
          chmod 755 ${PKG_DIR}/usr/bin/${APP_NAME}
          chmod 755 ${BIN_PATH}
          chmod -R 644 ${LIB_DIR}/*.so* 2>/dev/null || true

          dpkg-deb -Zxz -z9 --build ${PKG_DIR} ${APP_NAME}_${VERSION}_amd64.deb

      - name: Upload Linux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: graber-linux-deb
          path: "*.deb"

      - name: Attach Linux DEB to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # 2. WINDOWS PORTABLE ZIP BUILD
  # ==========================================
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Qt 6 (Windows LTS)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          arch: 'win64_msvc2019_64'

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Application (Windows)
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package Windows Portable Zip
        shell: pwsh
        run: |
          $APP_NAME = "graber"
          $VERSION = if ("${env:GITHUB_REF_NAME}") { "${env:GITHUB_REF_NAME}".TrimStart("v") } else { "1.0.0" }

          mkdir windows-package

          $EXE = Get-ChildItem -Path "build" -Recurse -Filter "$APP_NAME.exe" | Select-Object -First 1
          if (-not $EXE) {
            Write-Error "Executable $APP_NAME.exe not found!"
            exit 1
          }

          Copy-Item $EXE.FullName -Destination "windows-package/"
          windeployqt --release --no-compiler-runtime "windows-package/$APP_NAME.exe"
          Compress-Archive -Path "windows-package/*" -DestinationPath "${APP_NAME}_${VERSION}_windows_x64.zip"

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: graber-windows-zip
          path: "*.zip"

      - name: Attach Windows Zip to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: "*.zip"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # 3. NOTIFY DEVELOPER VIA EMAIL
  # ==========================================
  notify-developer:
    needs: [build-linux-deb, build-windows]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        env:
          LINUX_RES: ${{ needs.build-linux-deb.result }}
          WIN_RES: ${{ needs.build-windows.result }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Graber Build Status: ${{ github.ref_name }}"
          to: emran.blue.120@gmail.com
          from: "Graber CI/CD <ci@graber.app>"
          body: |
            Hello,

            The cross-platform build pipeline for Graber (${{ github.ref_name }}) has completed.

            Status:
            - Linux .deb Build: ${{ needs.build-linux-deb.result }}
            - Windows .zip Build: ${{ needs.build-windows.result }}

            Commit: ${{ github.sha }}
            Repository: ${{ github.repository }}
            Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
