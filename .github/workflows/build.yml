name: Build Cross-Platform (Linux & Windows) & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

env:
  APP_NAME: graber

jobs:
  build-linux-deb:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Build Tools & Qt6 via APT
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            patchelf \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libx11-dev \
            libxcb-cursor0 \
            imagemagick

      - name: Resolve package version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0+${GITHUB_RUN_NUMBER}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9] ]]; then
            VERSION="0.0.0+${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION"

      - name: Verify packaging scripts exist
        run: |
          test -f packaging/linux/build-deb.sh
          test -f packaging/linux/graber.desktop
          chmod +x packaging/linux/build-deb.sh

      - name: Build Application (Linux)
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc)"
          test -x "build/${APP_NAME}"

      - name: Package Self-Contained DEB with Desktop Entry
        run: packaging/linux/build-deb.sh "${{ steps.ver.outputs.version }}" build

      - name: Upload Linux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: graber-linux-deb
          path: "*.deb"
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Qt 6 (Windows LTS)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          arch: "win64_msvc2019_64"
          cache: true

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Resolve package version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0+${GITHUB_RUN_NUMBER}"
          fi
          VERSION="${VERSION//\//-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify packaging scripts exist
        shell: bash
        run: test -f packaging/windows/Create-Desktop-Shortcut.ps1

      - name: Build Application (Windows)
        shell: cmd
        run: |
          if defined QT_ROOT_DIR (
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%QT_ROOT_DIR%
          ) else (
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          )
          cmake --build build --config Release --parallel

      - name: Package Windows Portable Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $APP_NAME = "graber"
          $VERSION = "${{ steps.ver.outputs.version }}"
          $pkg = "windows-package"
          if (Test-Path $pkg) { Remove-Item -Recurse -Force $pkg }
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null

          $exe = Get-ChildItem -Path "build" -Recurse -Filter "$APP_NAME.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "Executable $APP_NAME.exe not found under build/"
            exit 1
          }
          Copy-Item $exe.FullName -Destination "$pkg\"

          $deployArgs = @("--release", "--no-translations", "--compiler-runtime", "$pkg\$APP_NAME.exe")
          & windeployqt @deployArgs
          if ($LASTEXITCODE -ne 0) {
            & windeployqt --release "$pkg\$APP_NAME.exe"
            if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          }

          if (Test-Path "resources\icons\app.ico") {
            Copy-Item "resources\icons\app.ico" -Destination "$pkg\graber.ico"
          }

          Copy-Item "packaging\windows\Create-Desktop-Shortcut.ps1" -Destination "$pkg\"

          @"
          @echo off
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0Create-Desktop-Shortcut.ps1"
          if errorlevel 1 pause
          "@ | Set-Content -Encoding ASCII "$pkg\Create Desktop Shortcut.cmd"

          $zip = "${APP_NAME}_${VERSION}_windows_x64.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path "$pkg\*" -DestinationPath $zip -Force
          Get-Item $zip | Format-List Name, Length, FullName

      - name: Upload Windows Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: graber-windows-zip
          path: "*.zip"
          if-no-files-found: error

  release:
    needs: [build-linux-deb, build-windows]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux DEB Artifact
        uses: actions/download-artifact@v4
        with:
          name: graber-linux-deb
          path: dist

      - name: Download Windows Zip Artifact
        uses: actions/download-artifact@v4
        with:
          name: graber-windows-zip
          path: dist

      - name: List release files
        run: ls -lah dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.event_name == 'workflow_dispatch' && github.ref_type != 'tag') && 'nightly' || github.ref_name }}
          name: ${{ (github.event_name == 'workflow_dispatch' && github.ref_type != 'tag') && 'Nightly build' || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-developer:
    needs: [build-linux-deb, build-windows, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Email Notification
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Graber Build Status: ${{ github.ref_name }}"
          to: emran.blue.120@gmail.com
          from: "Graber CI/CD <ci@graber.app>"
          body: |
            Hello,

            Cross-platform build for Graber (${{ github.ref_name }}) finished.

            Status:
            - Linux .deb: ${{ needs.build-linux-deb.result }}
            - Windows .zip: ${{ needs.build-windows.result }}
            - Release job: ${{ needs.release.result }}

            Commit: ${{ github.sha }}
            Repo: ${{ github.repository }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Linux: after sudo dpkg -i graber_*.deb, open "Clipboard Graber" from the app menu.
            Windows portable: unzip, then double-click "Create Desktop Shortcut.cmd" once.
