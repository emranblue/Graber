name: Build Self-Contained DEB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-deb:
    # Building on ubuntu-22.04 ensures forward compatibility with newer glibc systems
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Build Tools & patchelf
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            patchelf \
            strip-nondeterminism \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxkbcommon-dev \
            libdbus-1-dev

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0' # Adjust version if needed
          arch: 'gcc_64'
          dir: '${{ github.workspace }}/Qt'

      - name: Build Application
        run: |
          # Configure and build using CMake (adjust if using qmake directly)
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

          # If using qmake directly instead of CMake, use this:
          # ${{ env.Qt6_DIR }}/bin/qmake -o Makefile Graber.pro
          # make -j$(nproc)

      - name: Package Self-Contained DEB
        run: |
          APP_NAME="graber"
          PKG_DIR="package-root"

          # 1. Prepare Directory Hierarchy
          mkdir -p ${PKG_DIR}/DEBIAN
          mkdir -p ${PKG_DIR}/usr/bin
          mkdir -p ${PKG_DIR}/usr/lib/${APP_NAME}
          mkdir -p ${PKG_DIR}/usr/lib/${APP_NAME}/platforms

          # 2. Copy Built Binary
          # (Ensure 'build/graber' matches your build output path)
          cp build/${APP_NAME} ${PKG_DIR}/usr/bin/

          BIN_PATH="${PKG_DIR}/usr/bin/${APP_NAME}"
          LIB_DIR="${PKG_DIR}/usr/lib/${APP_NAME}"

          # 3. Copy Qt Platform Plugins (XCB for Linux desktop UI rendering)
          cp -r ${{ env.Qt6_DIR }}/plugins/platforms/* ${LIB_DIR}/platforms/

          # 4. Copy Shared Library Dependencies using ldd
          ldd "${BIN_PATH}" | grep "=>" | awk '{print $3}' | grep -v '^$' | while read -r lib; do
            if [ -f "$lib" ]; then
              case "$(basename "$lib")" in
                # Exclude core glibc libraries to prevent system crashes across distros
                libc.so*|libpthread.so*|libdl.so*|libm.so*|librt.so*|ld-linux*)
                  ;;
                *)
                  cp -L "$lib" "${LIB_DIR}/"
                  ;;
              esac
            fi
          done

          # 5. Patch RPATH using patchelf
          # Sets binary to look in /usr/lib/graber/ for bundled libraries
          patchelf --set-rpath "\$ORIGIN/../lib/${APP_NAME}" "${BIN_PATH}"

          # Patch all copied libraries and platform plugins
          for lib in "${LIB_DIR}"/*.so* "${LIB_DIR}"/platforms/*.so*; do
            if [ -f "$lib" ]; then
              patchelf --set-rpath "\$ORIGIN" "$lib" 2>/dev/null || true
            fi
          done

          # 6. Strip Debug Symbols (significantly reduces package size)
          strip --strip-unneeded "${BIN_PATH}" 2>/dev/null || true
          for lib in "${LIB_DIR}"/*.so* "${LIB_DIR}"/platforms/*.so*; do
            if [ -f "$lib" ]; then
              strip --strip-unneeded "$lib" 2>/dev/null || true
            fi
          done

          # 7. Write minimal DEBIAN/control File (No local dependencies specified)
          cat <<EOF > ${PKG_DIR}/DEBIAN/control
          Package: ${APP_NAME}
          Version: 1.0.0
          Architecture: amd64
          Maintainer: Developer <dev@example.com>
          Section: utils
          Priority: optional
          Description: Fully self-contained ${APP_NAME} application.
          EOF

          # Set Permissions
          chmod -R 755 ${PKG_DIR}/DEBIAN
          chmod 755 ${BIN_PATH}
          chmod -R 644 ${LIB_DIR}/*.so* 2>/dev/null || true

          # 8. Build Compressed DEB Package
          dpkg-deb -Zxz -z9 --build ${PKG_DIR} ${APP_NAME}_1.0.0_amd64.deb

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: graber-standalone-deb
          path: "*.deb"
